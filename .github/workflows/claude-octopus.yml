# Claude Octopus - Multi-Agent Orchestration for CI/CD
# This workflow runs Claude Octopus in CI mode for automated code review and development
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN - Long-lived Claude Code token for CI
#
# Optional secrets:
#   ANTHROPIC_API_KEY - Alternative Claude API authentication

name: Claude Octopus

on:
  # Manual trigger with custom prompt
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run (auto, embrace, research, develop, deliver)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - embrace
          - research
          - develop
          - deliver
          - review
      prompt:
        description: 'Prompt for the AI agents'
        required: true
        type: string
      tier:
        description: 'Model tier (quick, standard, premium)'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - premium

  # Trigger on pull request for code review
  pull_request:
    types: [opened, synchronize, reopened]

  # Trigger on issue comments with /octopus command
  issue_comment:
    types: [created]

jobs:
  # Job for manual workflow dispatch
  manual-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.228

      - name: Run Claude Octopus
        id: octopus
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OCTOPUS_DISABLE_BARE: 1
          CI: true
          GITHUB_OUTPUT: ${{ github.output }}
          # SECURITY: Pass inputs via env vars to prevent shell injection
          OCTOPUS_COMMAND: ${{ inputs.command }}
          OCTOPUS_PROMPT: ${{ inputs.prompt }}
          OCTOPUS_TIER: ${{ inputs.tier }}
        run: |
          chmod +x ./scripts/orchestrate.sh

          TIER_FLAG=""
          case "$OCTOPUS_TIER" in
            quick) TIER_FLAG="-Q" ;;
            premium) TIER_FLAG="-P" ;;
          esac

          # SECURITY: Validate command against allowlist
          case "$OCTOPUS_COMMAND" in
            auto|embrace|research|develop|deliver|review)
              ./scripts/orchestrate.sh --ci $TIER_FLAG "$OCTOPUS_COMMAND" "$OCTOPUS_PROMPT"
              ;;
            *)
              echo "::error::Invalid command: $OCTOPUS_COMMAND"
              exit 1
              ;;
          esac

      - name: Upload Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: octopus-results
          path: ~/.claude-octopus/results/
          if-no-files-found: ignore

  # Job for PR code review
  # Fork PRs: secrets are unavailable and GITHUB_TOKEN is read-only, so the
  # review step produces nothing and the comment step 403s. Guard to first-party
  # PRs only; fork contributors see CodeRabbit review instead.
  pr-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.228

      - name: Materialize PR Diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --no-ext-diff "origin/${BASE_REF}...HEAD" > pr-review.diff

      - name: Run Code Review
        id: review
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OCTOPUS_DISABLE_BARE: 1
          CI: true
        run: |
          set -o pipefail
          chmod +x ./scripts/orchestrate.sh

          ./scripts/orchestrate.sh --ci code-review '{"target":"pr-review.diff","publish":"never"}' 2>&1 | tee review-output-primary.txt

      # Claude subscription quotas are independent of Actions and can exhaust
      # while the workflow credential remains valid. GitHub Models was retired
      # on 2026-07-30, so use its supported Copilot CLI successor with the
      # short-lived job token and no model tools (#893).
      - name: Install GitHub Copilot CLI Fallback
        if: steps.review.outcome == 'failure'
        run: npm install -g @github/copilot@1.0.79

      - name: Run GitHub Copilot Fallback Review
        id: review_fallback
        if: steps.review.outcome == 'failure'
        env:
          OCTOPUS_REVIEW_SINGLE_PROVIDER: copilot
          OCTOPUS_COPILOT_MODEL: auto
          OCTOPUS_COPILOT_TOOL_POLICY: none
          GITHUB_TOKEN: ${{ github.token }}
          OCTOPUS_DISABLE_BARE: 1
          CI: true
        run: |
          set -o pipefail
          chmod +x ./scripts/orchestrate.sh

          ./scripts/orchestrate.sh --ci code-review '{"target":"pr-review.diff","publish":"never"}' 2>&1 | tee review-output-fallback.txt

      - name: Finalize Review Outcome
        id: review_outcome
        if: always()
        env:
          PRIMARY_OUTCOME: ${{ steps.review.outcome }}
          FALLBACK_OUTCOME: ${{ steps.review_fallback.outcome }}
        run: |
          : > review-output.txt
          if [[ -f review-output-primary.txt ]]; then
            sed -n '1,$p' review-output-primary.txt >> review-output.txt
          fi
          if [[ -f review-output-fallback.txt ]]; then
            printf '\n## GitHub Copilot fallback\n\n' >> review-output.txt
            sed -n '1,$p' review-output-fallback.txt >> review-output.txt
          fi

          if [[ "$PRIMARY_OUTCOME" == "success" || "$FALLBACK_OUTCOME" == "success" ]]; then
            exit 0
          fi

          echo "::error::Both the primary and GitHub Copilot review paths failed"
          exit 1

      - name: Upload PR Review Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: octopus-pr-review-${{ github.run_id }}
          path: |
            review-output.txt
            ~/.claude-octopus/results/
            ~/.claude-octopus/runs/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Post Review Comment
        if: always() && steps.review_outcome.outcome != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('review-output.txt', 'utf8');

            const body = `## Claude Octopus Code Review

            ${output.slice(0, 60000)}

            ---
            *Reviewed by Claude Octopus Multi-Agent System*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # Job for issue comment commands
  #
  # Trust gate: this job holds issues/pull-requests write and spends the repo's
  # provider API keys, so it must never run for a drive-by commenter. Restrict
  # to accounts GitHub already vouches for on this repo (same intent as the
  # pr-review job's first-party guard above). author_association is computed by
  # GitHub from repo permissions and cannot be set by the commenter.
  comment-command:
    if: >
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/octopus') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.228

      - name: Parse Command
        id: parse
        env:
          # SECURITY: Pass comment body via env var to prevent shell injection
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Extract command after /octopus
          RAW_PROMPT="${COMMENT_BODY#/octopus }"

          # SECURITY: Sanitize - remove dangerous shell metacharacters
          SAFE_PROMPT=$(echo "$RAW_PROMPT" | tr -cd 'a-zA-Z0-9 _.,:;!?@#%^&*()+=[]{}|<>/-' | head -c 5000)

          # SECURITY: Check for potential command injection patterns
          if echo "$SAFE_PROMPT" | grep -qE '\$\(|`|;[[:space:]]*[a-z]|&&[[:space:]]*[a-z]|\|[[:space:]]*[a-z]'; then
            echo "::error::Potential command injection detected in comment"
            exit 1
          fi

          echo "prompt=$SAFE_PROMPT" >> $GITHUB_OUTPUT

      - name: Run Claude Octopus
        id: octopus
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OCTOPUS_DISABLE_BARE: 1
          CI: true
          # SECURITY: Pass prompt via env var
          OCTOPUS_PROMPT: ${{ steps.parse.outputs.prompt }}
        run: |
          set -o pipefail
          chmod +x ./scripts/orchestrate.sh
          ./scripts/orchestrate.sh --ci auto "$OCTOPUS_PROMPT" 2>&1 | tee octopus-output.txt

      - name: Reply to Comment
        if: always() && steps.octopus.outcome != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('octopus-output.txt', 'utf8');

            const body = `## Claude Octopus Response

            ${output.slice(0, 60000)}

            ---
            *Generated by Claude Octopus Multi-Agent System*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
