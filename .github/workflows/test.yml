name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Required before a merge queue can be enabled on main. The queue dispatches
  # merge_group events against a temporary branch holding the projected result
  # of merging the queued PRs; if no workflow answers that event, the required
  # checks never report and every queue entry hangs until it times out. Adding
  # the trigger is inert until a queue exists, so it lands first, on its own.
  merge_group:
  schedule:
    # Nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two pull_request runs for the same SHA have repeatedly raced here, and the
# loser is reported as a failed required check even though the winner passed —
# which blocked merges four times while the underlying tests were green.
# Collapse duplicates per PR so only the newest run reports.
#
# cancel-in-progress is deliberately restricted to pull_request. A main-branch
# run must never be cancelled: RELEASING.md step 9 gates the release tag on the
# Test Suite for the exact post-squash commit, and cancelling it would either
# block a valid release or, worse, leave main unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      full_unit: ${{ steps.classify.outputs.full_unit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          # Only a PR may use focused coverage. Main, queue, nightly and manual
          # runs always prove the complete unit inventory on the tested commit.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "full_unit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          if [[ -z "$changed" ]]; then
            echo "full_unit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selector_args=()
          while IFS= read -r file; do
            selector_args+=(--changed "$file")
          done <<< "$changed"
          selection="$(./scripts/ci-changed.sh --list --unit-only --skip-smoke "${selector_args[@]}")"
          printf '%s\n' "$selection"
          if grep -qx 'Mode: focused' <<< "$selection"; then
            echo "full_unit=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_unit=true" >> "$GITHUB_OUTPUT"
          fi

  vendor-freshness:
    name: Vendor Freshness
    # Nightly/manual only — not a PR gate. Fails when a vendored dependency is
    # stale (exit 2) or unhealthy (exit 1) so maintainers see it in the nightly run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check vendored dependencies against upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-vendor-updates.sh --ci

  portability-lint:
    name: Portability Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify Codex skills are up to date
        run: ./scripts/build-codex-skills.sh --check

      - name: Check for GNU-only sed patterns
        run: |
          echo "Checking for non-portable sed usage..."
          FAIL=0
          # GNU-only command grouping in sed address ranges: sed '/pat/,/pat/{...}'
          # This is the actual bug class from issue #255. sed -i is handled with
          # platform conditionals throughout the codebase (see lib/config-display.sh).
          if grep -rnE "sed\s.*'/[^']*,/[^']*\{" scripts/ hooks/ 2>/dev/null; then
            echo "FAIL: GNU-only sed command grouping found. Use awk instead."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Policy: use awk/grep for multi-line extraction. Reserve sed for single-line s/// only."
            exit 1
          fi
          echo "OK: No non-portable sed patterns found."

      # CLAUDE.md sets a Bash 3.2 floor because macOS ships /bin/bash 3.2.57,
      # which has no associative arrays or namerefs. Nothing caught this before:
      # the macOS runner resolves `#!/usr/bin/env bash` to Homebrew bash 5 on
      # PATH, so a `declare -A` passes CI and then dies on a maintainer's stock
      # shell with `line N: <key>: unbound variable`. tests/ is included because
      # that is where the violation landed (#782).
      - name: Check for Bash 4+ constructs below the 3.2 floor
        run: |
          FAIL=0
          if grep -rnE '^[[:space:]]*(declare|local|typeset)[[:space:]]+-[A-Za-z]*A' \
              scripts/ hooks/ tests/ 2>/dev/null; then
            echo "::error::associative arrays require Bash 4; the floor is 3.2 (macOS /bin/bash)"
            FAIL=1
          fi
          if grep -rnE '^[[:space:]]*(declare|local)[[:space:]]+-n[[:space:]]' \
              scripts/ hooks/ tests/ 2>/dev/null; then
            echo "::error::namerefs require Bash 4.3; the floor is 3.2 (macOS /bin/bash)"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "No Bash 4+ constructs found."

      - name: Install ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          # Print the version: the runner's ShellCheck can be older than a
          # contributor's local build and emit codes local runs never show
          # (SC2120 did exactly that). When CI flags something you cannot
          # reproduce, compare this against your `shellcheck --version` and
          # suppress with a targeted `# shellcheck disable=` plus a reason.
          shellcheck --version

      # Enforcing, not advisory. This step used to end in `|| true`, so 406
      # warnings accumulated unseen — including the SC2221/SC2222 that marked a
      # dead `xai` allowlist arm and the SC2154 that marked a jq filter broken
      # by premature shell expansion. Both were live bugs.
      #
      # Excluded codes are stylistic and pervasive in this codebase:
      #   SC2034 unused variable (lib files export vars for their sourcers)
      #   SC2155 declare-and-assign masks the return value
      #   SC1090/SC1091 shellcheck cannot follow dynamic `source` paths
      # Everything else must stay at zero. Suppress a genuine false positive
      # with a targeted `# shellcheck disable=` and a reason, not by widening
      # this list.
      - name: Run ShellCheck on core scripts
        run: |
          shellcheck -s bash -S warning \
            -e SC2034,SC2155,SC1090,SC1091 \
            scripts/orchestrate.sh \
            scripts/lib/*.sh \
            hooks/*.sh

      # Exec-bit lint: shell/python entrypoints must stay 100755. Both contributor
      # tooling and editor-based rewrites have silently dropped exec bits (root
      # cause of PR #579's "Permission denied" failures). Intentional mode changes:
      # add the 'allow-mode-change' label to the PR.
      - name: Executable-bit lint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_MODE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-mode-change') }}
        run: |
          git fetch --no-tags origin "$BASE_REF" --depth=100 2>/dev/null || git fetch --no-tags origin "$BASE_REF"
          changes=$(git diff --summary "origin/${BASE_REF}...HEAD" 2>/dev/null | grep "mode change" || true)
          if [[ -z "$changes" ]]; then
            echo "OK: no file-mode changes vs ${BASE_REF}."
            exit 0
          fi
          echo "File-mode changes detected vs ${BASE_REF}:"
          echo "$changes"
          if [[ "$ALLOW_MODE_CHANGE" == "true" ]]; then
            echo "Label 'allow-mode-change' present; passing."
            exit 0
          fi
          echo ""
          echo "Shell scripts and Python helpers must keep the executable bit (100755)."
          echo "Fix: chmod +x <file> && git add <file>, or add the 'allow-mode-change' label if intentional."
          exit 1

  smoke:
    name: Smoke Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    needs: classify-changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated artifacts
        run: make sync-check

      - name: Run smoke tests
        run: make test-smoke

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-test-logs-${{ matrix.os }}
          path: /tmp/test_*.log
          retention-days: 7

  # Mapped PRs run their affected suites on both supported platforms. Shared
  # or unmapped changes fail closed to the complete sharded inventory.
  unit-focused:
    name: Unit Tests (focused, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [classify-changes, smoke, portability-lint]
    if: github.event_name == 'pull_request' && needs.classify-changes.outputs.full_unit != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install adapter test dependencies
        run: make test-deps

      - name: Run changed-surface unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci-changed.sh --base "$BASE_SHA" --unit-only --skip-smoke --committed-only

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: focused-unit-test-logs-${{ matrix.os }}
          path: /tmp/test_*.log
          retention-days: 7

  unit-full:
    name: Unit Tests (full, ${{ matrix.os }}, shard ${{ matrix.shard_index }})
    runs-on: ${{ matrix.os }}
    # Run every unit suite once per OS. Weighted shards shorten the longest
    # lane without dropping slow lifecycle contracts or duplicating council.
    timeout-minutes: 30
    needs: [classify-changes, smoke, portability-lint]
    if: github.event_name != 'pull_request' || needs.classify-changes.outputs.full_unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard_index: [0, 1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install adapter test dependencies
        run: make test-deps

      - name: Run full unit shard
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: python3 tests/helpers/run-ci-step.py --timeout=1200 --log "$RUNNER_TEMP/octopus-ci-output/unit.log" -- ./tests/run-all.sh unit --shard-index="$SHARD_INDEX" --shard-count=4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-results-${{ matrix.os }}-${{ matrix.shard_index }}
          path: test-results*.xml
          retention-days: 30

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-logs-${{ matrix.os }}-${{ matrix.shard_index }}
          path: |
            ${{ runner.temp }}/octopus-ci-output/unit.log
            /tmp/test_*.log
          retention-days: 7

  # Catches tests that conflate logical and physical paths. This failure mode is
  # invisible to every other job by construction: runners check out under a real
  # path, so a test deriving PROJECT_ROOT with `cd && pwd` while the code under
  # test resolves with `cd -P && pwd` agrees there and diverges anywhere behind a
  # symlink. #712 hit exactly that — test-feature-disclosure.sh failed only in a
  # /tmp release worktree on macOS, which is the workflow RELEASING.md §0
  # recommends, so it bit at release time and CI could never have warned.
  #
  # Path behavior is covered by an explicit regression set on every event.
  # Repeating unrelated unit suites through the link adds no path coverage.
  symlinked-path:
    name: Symlinked Path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify-changes, smoke, portability-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install adapter test dependencies
        run: make test-deps

      - name: Run the proportional unit gate through a symlinked path
        run: |
          set -euo pipefail
          link="$(mktemp -d)/octo-linked"
          ln -s "$GITHUB_WORKSPACE" "$link"
          echo "Real path:    $GITHUB_WORKSPACE"
          echo "Via symlink:  $link"
          # Verify the link really is a distinct logical path, or this job would
          # silently duplicate the ordinary unit run and prove nothing.
          if [[ "$(cd "$link" && pwd)" == "$(cd "$link" && pwd -P)" ]]; then
            echo "::error::logical and physical paths match — the symlink is not exercising anything"
            exit 1
          fi
          cd "$link"
          make test-symlink-sensitive

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symlinked-path-logs
          path: /tmp/test_*.log
          retention-days: 7

  smoke-required:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [classify-changes, smoke, portability-lint]
    if: always()
    steps:
      - name: Verify smoke and portability gates passed
        run: |
          [[ "${{ needs.classify-changes.result }}" == "success" ]] &&
          [[ "${{ needs.smoke.result }}" == "success" ]] &&
          [[ "${{ needs.portability-lint.result }}" == "success" ]]

  unit-required:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [classify-changes, unit-focused, unit-full, symlinked-path]
    if: always()
    steps:
      - name: Verify the selected unit tier passed
        run: |
          [[ "${{ needs.classify-changes.result }}" == "success" ]] || exit 1
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.classify-changes.outputs.full_unit }}" == "false" ]]; then
            unit_result="${{ needs.unit-focused.result }}"
          else
            unit_result="${{ needs.unit-full.result }}"
          fi
          [[ "$unit_result" == "success" ]] &&
          [[ "${{ needs.symlinked-path.result }}" == "success" ]]

  integration-heavy:
    name: Integration Tests (full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Integration does not consume unit artifacts; run it alongside units.
    needs: smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run integration tests
        run: make test-integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-results
          path: test-results*.xml
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-logs
          path: /tmp/test_*.log
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [classify-changes, integration-heavy]
    if: always()
    steps:
      - name: Verify integration tests passed
        run: |
          [[ "${{ needs.classify-changes.result }}" == "success" ]] &&
          [[ "${{ needs.integration-heavy.result }}" == "success" ]]

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-required, unit-required, integration, portability-lint]
    if: always()

    steps:
      - name: Create test summary
        run: |
          {
            echo "# Claude Octopus Test Summary"
            echo ""
            echo "## Test Results"
            echo ""
            echo "| Category | Status |"
            echo "|----------|--------|"
            echo "| Smoke | ${{ needs.smoke-required.result }} |"
            echo "| Unit | ${{ needs.unit-required.result }} |"
            echo "| Integration | ${{ needs.integration.result }} |"
            echo "| Portability | ${{ needs.portability-lint.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "${{ needs.smoke-required.result }}" == "success" ]] &&
          [[ "${{ needs.unit-required.result }}" == "success" ]] &&
          [[ "${{ needs.integration.result }}" == "success" ]] &&
          [[ "${{ needs.portability-lint.result }}" == "success" ]]
